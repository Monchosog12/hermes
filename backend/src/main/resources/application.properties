# Correo saliente vía Brevo (SMTP relay). Credenciales en variables de entorno:
#   BREVO_SMTP_USER -> "Login" de Brevo (SMTP & API > SMTP), ej. 8a1b2c001@smtp-brevo.com
#   BREVO_SMTP_KEY  -> clave SMTP generada en Brevo
#   MAIL_FROM       -> remitente verificado en Brevo (Senders, Domains & Dedicated IPs > Senders)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
hermes.mail.from=${MAIL_FROM}
hermes.mail.from-name=Hermes