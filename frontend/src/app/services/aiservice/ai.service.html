<section class="card" aria-labelledby="ai-models-title">
  <h3 id="ai-models-title">Modelos de IA disponibles</h3>
  @if (ai.modelsError(); as error) {
    <p class="alert alert-error" role="alert">{{ error }}</p>
  } @else if (ai.models().length === 0) {
    <p class="muted" role="status">Cargando modelos…</p>
  } @else {
    <ul>
      @for (model of ai.models(); track model.id) {
        <li>{{ model.label }}</li>
      }
    </ul>
    <p class="hint">Puedes comparar las respuestas cambiando de modelo en cada solicitud.</p>
  }
</section>
