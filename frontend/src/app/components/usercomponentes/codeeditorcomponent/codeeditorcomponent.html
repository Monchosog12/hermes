<div class="editor-box">
  <div class="editor-bar">
    <span class="editor-title">{{ label() }}</span>
    <span class="spacer"></span>
    @if (!readOnly()) {
      <span class="counter" [class.over]="value().length > maxChars()" aria-live="polite">
        {{ value().length }} / {{ maxChars() }}
      </span>
    }
    @if (allowUpload()) {
      <input #file class="visually-hidden" type="file" [accept]="accept" tabindex="-1"
             (change)="onFile(file)" />
      <button class="btn btn-ghost btn-small" type="button" (click)="file.click()">Cargar archivo</button>
    }
  </div>
  <div #host class="editor-host"></div>
</div>
@if (uploadError(); as message) {
  <p class="alert alert-error" role="alert">{{ message }}</p>
}
