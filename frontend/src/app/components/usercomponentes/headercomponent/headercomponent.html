<header class="topbar">
  <a class="brand" routerLink="/">CodeForge AI</a>
  <nav aria-label="Principal">
    <a routerLink="/traductor" routerLinkActive="active">Traductor</a>
    <a routerLink="/mejora-codigo" routerLinkActive="active">Mejorar código</a>
    <a routerLink="/historial" routerLinkActive="active">Historial</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Administración</a>
    }
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="user muted">{{ user.fullName }}</span>
  }
  <button class="btn btn-ghost" type="button" (click)="auth.logout()">Cerrar sesión</button>
</header>
