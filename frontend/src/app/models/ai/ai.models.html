<section class="card" aria-labelledby="ai-ops-title">
  <h3 id="ai-ops-title">Operaciones disponibles</h3>
  <ul>
    @for (op of operations; track op.code) {
      <li><strong>{{ op.label }}:</strong> {{ op.help }}</li>
    }
  </ul>
  <p class="hint">Máximo {{ maxChars | number }} caracteres por solicitud.</p>
</section>
