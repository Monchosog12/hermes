<header class="header">
  <a class="brand" routerLink="/" aria-label="CodeShift, inicio">
    <span class="brand-icon">
      <span>&lt;/&gt;</span>
    </span>

    <span class="brand-name">
      Her<span>mes</span>
    </span>
  </a>

  <nav class="navigation" aria-label="Navegación principal">
    <a routerLink="/traductor" routerLinkActive="active">
      <i class="bi bi-arrow-left-right"></i>
      <span>Traductor</span>
    </a>

    <a routerLink="/mejorar-codigo" routerLinkActive="active">
      <i class="bi bi-stars"></i>
      <span>Mejorar código</span>
    </a>

    <a routerLink="/admin" routerLinkActive="active">
      <i class="bi bi-shield-check"></i>
      <span>Administración</span>
    </a>
  </nav>

  <div class="header-status">
    <!-- From Uiverse.io by CristianMontoya98 -->
    <button class="btn"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#modalLogin"> Ingresa
    </button>
    <button class="btn"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#modalRegistro"> Registrate
    </button>
  </div>
</header>

<div
  class=" modal fade
    "
  id="modalLogin"
  tabindex="-1"
  aria-labelledby="modalLoginLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">
          <h2 id="modalLoginLabel">Iniciar sesión</h2>

          <form>
            <div class="campo">
              <label for="correo">Correo electrónico</label>
              <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required>
            </div>

            <div class="campo">
              <label for="clave">Contraseña</label>
              <input
                type="password"
                id="clave"
                name="clave"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required>
            </div>

            <button type="submit" class="btn-login">
              Iniciar sesión
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>


<!-- Botón para abrir el registro -->
<button
  class="btn"
  type="button"
  data-bs-toggle="modal"
  data-bs-target="#modalRegistro">
  Regístrate
</button>

<!-- Modal de registro -->
<div
  class="modal fade"
  id="modalRegistro"
  tabindex="-1"
  aria-labelledby="modalRegistroLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <!-- Botón para cerrar -->
        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">
          <h2 id="modalRegistroLabel">Crear cuenta</h2>

          <form>
            <!-- Nombre -->
            <div class="campo">
              <label for="nombreRegistro">Nombre completo</label>
              <input
                type="text"
                id="nombreRegistro"
                name="nombre"
                placeholder="Ingresa tu nombre"
                autocomplete="name"
                required>
            </div>

            <!-- Correo -->
            <div class="campo">
              <label for="correoRegistro">Correo electrónico</label>
              <input
                type="email"
                id="correoRegistro"
                name="correo"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required>
            </div>

            <!-- Contraseña -->
            <div class="campo">
              <label for="claveRegistro">Contraseña</label>
              <input
                type="password"
                id="claveRegistro"
                name="clave"
                placeholder="Crea una contraseña"
                autocomplete="new-password"
                required>
            </div>

            <!-- Confirmar contraseña -->
            <div class="campo">
              <label for="confirmarClaveRegistro">
                Confirmar contraseña
              </label>
              <input
                type="password"
                id="confirmarClaveRegistro"
                name="confirmarClave"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                required>
            </div>

            <button type="submit" class="btn-login">
              Crear cuenta
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
