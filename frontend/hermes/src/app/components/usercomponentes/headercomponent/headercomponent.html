<header class="header">
  <a class="brand" routerLink="/" aria-label="CodeShift, inicio">
    <span class="brand-icon">
      <span>&lt;/&gt;</span>
    </span>

    <span class="brand-name">
      Her<span>mes</span>
    </span>
  </a>

  <nav class="navigation" aria-label="Navegación principal">
    <a routerLink="/usuario/traductor" routerLinkActive="active">
      <i class="bi bi-arrow-left-right"></i>
      <span>Traductor</span>
    </a>

    <a routerLink="/usuario/mejoracodigo" routerLinkActive="active">
      <i class="bi bi-stars"></i>
      <span>Mejorar código</span>
    </a>

    <a routerLink="usuario/historial" routerLinkActive="active">
      <i class="bi bi-clock-history"></i>
      <span>Historial</span>
    </a>
  </nav>

  <div class="header-status">
    <!-- From Uiverse.io by CristianMontoya98 -->
    <button class="btn"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#modalLogin"> Ingresa
    </button>
    <button class="btn"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#modalRegistro"> Registrate
    </button>
  </div>
</header>

<div
  class=" modal fade"
  id="modalLogin"
  tabindex="-1"
  aria-labelledby="modalLoginLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">
          <h2 id="modalLoginLabel">Iniciar sesión</h2>

          <form [formGroup]="inicio" (ngSubmit)="login()" >
            <div class="campo">
              <label for="correo">Correo electrónico</label>
              <input
                type="email"
                id="correo"
                name="correo"
                formControlName="email"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required>
            </div>


            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                formControlName="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required>
            </div>

            <div
              *ngIf="mensajeServidor"
              class="mensaje-servidor"
              [ngClass]="tipoMensaje">

              {{ mensajeServidor }}

            </div>

            <button class="btn-login" type="submit" [disabled]="inicio.invalid">
              Inicio
            </button>


          </form>
        </div>

      </div>
    </div>
  </div>
</div>


<!-- Modal de registro -->
<div
  class="modal fade"
  id="modalRegistro"
  tabindex="-1"
  aria-labelledby="modalRegistroLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <!-- Botón para cerrar -->
        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">

          <h2 id="modalRegistroLabel">Crear cuenta</h2>

          <form [formGroup]="registrar" (ngSubmit)="onSubmit()">
            <!-- Nombre -->
            <div class="campo">
              <label for="nombre">Nombre completo</label>
              <input
                type="text"
                id="nombre"
                name="username"
                formControlName="username"
                placeholder="Ingresa tu nombre"
                autocomplete="username"
                required>
            </div>

            <!-- Correo -->
            <div class="campo">
              <label for="email">Correo electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                formControlName="email"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required>
            </div>


            <!-- Contraseña -->
            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                formControlName="password"
                placeholder="Crea una contraseña"
                autocomplete="new-password"
                required>
            </div>
            <div
              *ngIf="mensajeServidor"
              class="mensaje-servidor"
              [ngClass]="tipoMensaje">

              {{ mensajeServidor }}

            </div>

            <button class="btn-login" type="submit" [disabled]="registrar.invalid">
              registrarse
            </button>

          </form>
        </div>

      </div>
    </div>
  </div>
</div>
